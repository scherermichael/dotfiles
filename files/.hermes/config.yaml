model:
  provider: custom
  default: default
  base_url: http://127.0.0.1:8000/v1
  context_length: 65536
  max_tokens: 4096
tts:
  provider: say
  providers:
    say:
      type: command
      command: say -v {voice} -f {input_path} -o {output_path}.aiff && ffmpeg -loglevel
        error -y -i {output_path}.aiff {output_path}; rm -f {output_path}.aiff
      format: mp3
      voice: Jamie (Premium)
voice:
  auto_tts: true
web:
  search_backend: searxng
mcp_servers:
  fetch:
    command: uvx
    args:
      - mcp-server-fetch
      - --ignore-robots-txt
platform_toolsets:
  cli:
    - terminal
    - file
    - code_execution
    - search
    - browser
    - skills
    - image_gen
display:
  skin: monokai
onboarding:
  seen:
    busy_input_prompt: true
